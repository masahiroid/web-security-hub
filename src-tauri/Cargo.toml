[package]
name = "web-security-hub-desktop"
version = "5.0.0"
description = "Web Security Hub desktop launcher"
authors = ["Masahiro NAKATSUGAWA"]
license = "Apache-2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
dunce = "=1.0.5"

# GTK3 requires glib 0.18; backport the upstream VariantStrIter soundness fix.
# Provenance, exact upstream change and removal conditions are in PATCH.md.
[patch.crates-io]
glib = { path = "vendor/glib-0.18.5" }
