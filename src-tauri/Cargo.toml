[package]
name = "web-security-hub-desktop"
version = "2.0.0"
description = "Web Security Hub desktop launcher"
authors = ["Masahiro NAKATSUGAWA"]
license = "Apache-2.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
dunce = "=1.0.5"
