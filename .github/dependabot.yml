version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Keep declarations aligned with the supported Node.js runtime (24).
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # 12.19.x bundles a vulnerable shell-quote that dependency overrides cannot replace.
      - dependency-name: 'appium-xcuitest-driver'
        versions: ['12.19.x']
  - package-ecosystem: npm
    directory: /desktop/runtime
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
