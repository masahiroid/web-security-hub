name: Windows installer
on:
  push:
    branches: [develop, main, 'feature/**']
    paths-ignore: ['docs/**', '*.md', '.bestpractices.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.3'
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --prefix desktop/runtime
      - run: npm run lint
      - run: npm run typecheck
      - run: npm audit --audit-level=moderate
      - run: npm test
      - name: Verify real owned ZAP runtime
        run: npm run verifier:verify-zap -- --install
      - run: npm run release:check
      - uses: dtolnay/rust-toolchain@stable
      - run: npm run desktop:build -- --bundles nsis -- --locked
      - name: Verify installed native application
        run: node scripts/verify-windows-installed.js
      - name: Prepare installer and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/release-public | Out-Null
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter *.exe | Select-Object -First 1
          if (!$installer) { throw 'NSIS installer not found' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $destination = "artifacts/release-public/Web-Security-Hub_${version}_windows_x64_setup.exe"
          Copy-Item $installer.FullName $destination
          $digest = (Get-FileHash -Algorithm SHA256 $destination).Hash.ToLower()
          "$digest  $(Split-Path -Leaf $destination)" | Set-Content -Encoding ascii "$destination.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-installer
          path: artifacts/release-public/*
          retention-days: 3
          if-no-files-found: error
