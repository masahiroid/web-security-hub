<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>探索レポート</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 24px; color: #1e2420; background: #f6f7f5; }
  h1 { font-size: 20px; } h2 { font-size: 15px; margin-bottom: 4px; }
  .summary { color: #5b6459; margin-bottom: 24px; }
  section.page { background: #fff; border: 1px solid #d9ddd3; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .url { font-size: 12px; color: #5b6459; word-break: break-all; }
  .meta { font-size: 12px; color: #5b6459; }
  img { max-width: 320px; border: 1px solid #d9ddd3; border-radius: 6px; margin: 4px 8px 4px 0; }
  .states { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; }
  figure { margin: 0; font-size: 11px; color: #5b6459; }
  table { border-collapse: collapse; width: 100%; margin-top: 8px; }
  td, th { border: 1px solid #d9ddd3; padding: 6px 8px; font-size: 12px; text-align: left; }
</style></head>
<body>
  <h1>探索レポート</h1>
  <p class="summary">起点: https://example.test/ / 訪問ページ 2 / クリック探索 2 件 / スキップ 1 件（破壊的操作の可能性があり未クリック）</p>
  
    <section class="page">
      <h2>Home &lt;b&gt;</h2>
      <p class="url"><a href="https://example.test/" target="_blank" rel="noopener">https://example.test/</a></p>
      <img src="screenshots/home.png" alt="screenshot" loading="lazy">
      <p class="meta">リンク 3 件 / クリック探索 2 件 / スキップ 1 件</p>
      <div class="states">
        <figure>
          <img src="screenshots/s1.png" alt="Open &quot;menu&quot;" loading="lazy">
          <figcaption>「Open &quot;menu&quot;」をクリック</figcaption>
        </figure>
        <figure>
          
          <figcaption>「Go」をクリック → https://example.test/next</figcaption>
        </figure></div>
    </section>

    <section class="page">
      <h2>(no title)</h2>
      <p class="url"><a href="https://example.test/next" target="_blank" rel="noopener">https://example.test/next</a></p>
      
      <p class="meta">リンク 0 件 / クリック探索 0 件 / スキップ 0 件</p>
      
    </section>
  <h2>スキップした操作（要目視確認）</h2>
  <table><tr><th>ページ</th><th>ラベル</th><th>理由</th></tr><tr><td>https://example.test/</td><td>Delete &amp; go</td><td>destructive</td></tr></table>
</body></html>
