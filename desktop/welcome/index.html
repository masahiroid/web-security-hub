<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Web Security Hub — Setup</title><link rel="stylesheet" href="/desktop/style.css"></head><body><main>
<header><div><small>WEB SECURITY HUB</small><h1 data-i18n="title">使い始める準備</h1></div><select id="language" aria-label="Language"><option value="ja">日本語</option><option value="en">English</option></select></header>
<p data-i18n="intro">環境を確認して、診断ツール・操作マニュアル・ハンズオンへ進めます。</p>
<section><h2 data-i18n="environment">環境チェック</h2><div id="checks" aria-live="polite"></div><div class="actions"><button id="check" data-i18n="check">再確認</button><button id="install" data-i18n="install">必要なブラウザーをインストール</button></div><p class="hint" data-i18n="download">初回はインターネットから Chromium をダウンロードします。導入先は利用者の領域です。</p><p id="error" role="alert"></p><details id="logDetails" hidden><summary data-i18n="installLog">インストールログ</summary><pre id="log"></pre></details></section>
<section><h2 data-i18n="work">アプリを使う</h2><a class="button primary" href="/" id="openHub" data-i18n="open">診断・テストを開く</a><p class="hint" id="storage"></p></section>
<section><h2 data-i18n="learn">マニュアルと研修</h2><p data-i18n="learnHelp">サンプルを開始すると、日英の練習サイト設定も自動的に用意します。</p><div class="actions"><button id="training" data-i18n="training">ハンズオン環境を開始</button><a class="button" id="manual" href="/training/README.ja.html" data-i18n="manual">画像付き教材を開く</a><a class="button" id="desktopManual" href="/desktop/guide.ja.html" data-i18n="desktopManual">アプリ版の操作ガイド</a></div><div id="trainingControls" hidden><p id="trainingStatus" aria-live="polite"></p><a id="sample" href="http://127.0.0.1:4180/ja/login" data-i18n="sample">サンプルサイトを開く</a><p><a href="/?trainingScan=before" data-i18n="sastBefore">静的解析の修正前例を開く</a> · <a href="/?trainingScan=after" data-i18n="sastAfter">修正後例を開く</a></p><div class="actions"><button data-mode="baseline" data-i18n="baseline">基本版</button><button data-mode="changed" data-i18n="changed">変更版</button><button data-mode="fixed" data-i18n="fixed">修正版</button><button data-mode="reset" data-i18n="reset">サンプルを初期化</button></div><label><input id="confirmReset" type="checkbox"><span data-i18n="confirmReset">研修用2サイトの設定を初期化することを確認しました（過去の実行結果は残ります）</span></label><button id="resetConfig" data-i18n="resetConfig">研修設定も初期化</button></div></section>
<footer><span data-i18n="optional">ZAP・モバイル・AI は任意の追加機能です。基本コースには不要です。</span></footer>
</main><script src="/desktop/app.js"></script></body></html>
